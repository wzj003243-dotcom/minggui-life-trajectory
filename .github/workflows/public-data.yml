name: Public biography data

on:
  push:
    branches:
      - "data-run-public"
    paths:
      - "research/acquire/TRIGGER.md"

concurrency:
  group: -github-workflows-public-data-yml-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  public-data:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire verified public datasets
        run: python research/acquire/fetch_public_datasets.py
      - name: Normalize public cohorts
        run: python research/normalize/public_cohorts.py data/raw/acquired data/processed/public
      - name: Select balanced 100k exact-date cohort
        run: python research/cohorts/select_stratified_bhht.py data/processed/public/bhht_core.csv.gz data/processed/public/bhht_stratified_100k.csv.gz --target 100000
      - name: Fetch precision-aware Wikidata births for balanced 100k cohort
        run: python research/acquire/fetch_wikidata_birth_assertions.py data/processed/public/bhht_stratified_100k.csv.gz data/processed/public/wikidata_birth_assertions_100k.csv.gz --limit 0 --batch-size 150
      - name: Canonicalize conflict-safe birth table
        run: python research/pipeline/canonicalize_births.py data/processed/public/wikidata_birth_assertions_100k.csv.gz data/processed/public/canonical_births_100k.csv.gz
      - name: Install BaZi feature dependency
        run: pip install lunar_python==1.4.8
      - name: Build objective three-pillar features
        run: >
          python research/features/build_bazi_features.py
          data/processed/public/canonical_births_100k.csv.gz
          data/processed/public/bazi_features_100k.csv.gz
          --mode date
          --id-column wikidata_id
          --date-column birth_date
          --calendar-column calendar_model
      - name: Select 8k event-enrichment cohort
        run: >
          python research/cohorts/select_event_enrichment_cohort.py
          data/processed/public/bhht_stratified_100k.csv.gz
          data/processed/public/canonical_births_100k.csv.gz
          data/processed/public/event_cohort_8k.csv.gz
          --target 8000
      - name: Fetch dated Wikidata life claims for public event cohort
        run: >
          python research/acquire/fetch_wikidata_claims_api.py
          data/processed/public/event_cohort_8k.csv.gz
          data/processed/public/public_life_claims_8k.csv.gz
          --ratings ""
          --id-column wikidata_id
          --rating-column none
          --batch-size 35
      - name: Normalize public claims to life events
        run: >
          python research/pipeline/claims_to_life_events.py
          data/processed/public/public_life_claims_8k.csv.gz
          data/processed/public/canonical_births_100k.csv.gz
          data/processed/public/public_life_events_8k.csv.gz
      - name: Show reports
        if: always()
        run: |
          cat data/raw/acquired/acquisition_report.json || true
          cat data/processed/public/public_cohort_profile.json || true
          cat data/processed/public/bhht_stratified_100k.report.json || true
          cat data/processed/public/wikidata_birth_assertions_100k.report.json || true
          cat data/processed/public/canonical_births_100k.report.json || true
          cat data/processed/public/bazi_features_100k.report.json || true
          cat data/processed/public/event_cohort_8k.report.json || true
          cat data/processed/public/public_life_claims_8k.report.json || true
          cat data/processed/public/public_life_events_8k.report.json || true
      - name: Upload processed public cohort
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minggui-processed-public-data
          path: |
            data/processed/public/
            data/raw/acquired/acquisition_report.json
          retention-days: 14
          if-no-files-found: warn
