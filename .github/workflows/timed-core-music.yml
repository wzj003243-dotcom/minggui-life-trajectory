name: Timed core MusicBrainz sharded enrichment

on:
  push:
    branches:
      - "data-run-timed-music*"
    paths:
      - "research/acquire/TRIGGER_TIMED_MUSIC.md"

permissions:
  contents: read
  actions: read

jobs:
  shard:
    strategy:
      fail-fast: false
      matrix:
        shard: [0,1,2,3]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download frozen timed-core artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/wzj003243-dotcom/minggui-life-trajectory/actions/artifacts/11330742270/zip" \
            -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact

      - name: Build shard inputs
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          python - <<'PY'
          import csv,gzip,hashlib,os,pathlib,shutil
          shard=int(os.environ["SHARD"]); nshards=4
          def locate(name):
              hits=list(pathlib.Path("artifact").rglob(name))
              if not hits: raise SystemExit(f"missing {name}")
              return hits[0]
          cohort=locate("timed_linked_cohort.csv.gz")
          bridge=locate("musicbrainz_bridge.csv.gz")
          pathlib.Path("data/processed/music").mkdir(parents=True,exist_ok=True)
          with gzip.open(bridge,"rt",encoding="utf-8",newline="") as f:
              reader=csv.DictReader(f); br=list(reader); bfields=reader.fieldnames
          selected={r["wikidata_id"] for r in br if int(hashlib.sha256(r["wikidata_id"].encode()).hexdigest()[:8],16)%nshards==shard}
          with gzip.open(bridge,"rt",encoding="utf-8",newline="") as src,gzip.open("data/processed/music/bridge.csv.gz","wt",encoding="utf-8",newline="") as dst:
              rr=csv.DictReader(src); w=csv.DictWriter(dst,fieldnames=rr.fieldnames);w.writeheader()
              for r in rr:
                  if r["wikidata_id"] in selected:w.writerow(r)
          with gzip.open(cohort,"rt",encoding="utf-8",newline="") as src,gzip.open("data/processed/music/cohort.csv.gz","wt",encoding="utf-8",newline="") as dst:
              rr=csv.DictReader(src);w=csv.DictWriter(dst,fieldnames=rr.fieldnames);w.writeheader()
              for r in rr:
                  if r["wikidata_id"] in selected:w.writerow(r)
          print("shard",shard,"people",len(selected))
          PY

      - name: Fetch MusicBrainz timeline shard
        run: >
          python research/acquire/fetch_musicbrainz_events.py
          data/processed/music/cohort.csv.gz
          data/processed/music/out
          --id-column wikidata_id
          --limit 0
          --mbid-map data/processed/music/bridge.csv.gz

      - uses: actions/upload-artifact@v4
        with:
          name: music-shard-${{ matrix.shard }}
          path: data/processed/music/out/
          retention-days: 30

  merge:
    needs: shard
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: music-shard-*
          path: shards

      - name: Merge four complete shards
        run: |
          python - <<'PY'
          import csv,gzip,json,pathlib
          files=sorted(pathlib.Path("shards").rglob("music_events.csv.gz"))
          if len(files)!=4: raise SystemExit(f"expected 4 shards, got {len(files)}")
          pathlib.Path("merged").mkdir()
          fields=None;rows=0;people=set()
          with gzip.open("merged/music_events.csv.gz","wt",encoding="utf-8",newline="") as out:
              w=None
              for path in files:
                  with gzip.open(path,"rt",encoding="utf-8",newline="") as f:
                      r=csv.DictReader(f)
                      if fields is None:
                          fields=r.fieldnames;w=csv.DictWriter(out,fieldnames=fields);w.writeheader()
                      elif r.fieldnames!=fields: raise SystemExit("schema mismatch")
                      for row in r:
                          w.writerow(row);rows+=1;people.add(row["person_id"])
          reports=[]
          for p in pathlib.Path("shards").rglob("music_enrichment.report.json"):
              reports.append(json.loads(p.read_text()))
          report={
            "shards":4,
            "people_with_dated_music_events":len(people),
            "dated_event_rows":rows,
            "shard_reports":reports,
            "complete":True
          }
          pathlib.Path("merged/music_enrichment.report.json").write_text(json.dumps(report,indent=2),encoding="utf-8")
          print(json.dumps(report,indent=2))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: minggui-timed-core-musicbrainz-complete
          path: merged/
          retention-days: 30
