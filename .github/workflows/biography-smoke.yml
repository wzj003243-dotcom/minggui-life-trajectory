name: Biography adapter smoke

on:
  push:
    branches:
      - "data-run-biography-smoke*"
    paths:
      - "research/acquire/TRIGGER_BIOGRAPHY_SMOKE.md"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build tiny known-page cohort
        run: |
          python - <<'PY'
          import csv,gzip
          qids=["Q42","Q76","Q937","Q7259","Q5582","Q762","Q23","Q91","Q307","Q692","Q5879","Q8016"]
          with gzip.open("smoke.csv.gz","wt",encoding="utf-8",newline="") as f:
              w=csv.DictWriter(f,fieldnames=["wikidata_id"])
              w.writeheader()
              for q in qids:w.writerow({"wikidata_id":q})
          PY

      - name: Fetch revision-pinned biographies
        run: >
          python research/acquire/fetch_wikipedia_biographies.py
          smoke.csv.gz
          smoke_biographies.jsonl.gz
          --id-column wikidata_id
          --limit 12

      - name: Install parser
        run: pip install mwparserfromhell==0.7.2

      - name: Extract timeline candidates
        run: >
          python research/extraction/extract_timeline_candidates.py
          smoke_biographies.jsonl.gz
          smoke_candidates.csv.gz

      - name: Assert useful output
        run: |
          python - <<'PY'
          import json
          with open("smoke_biographies.report.json",encoding="utf-8") as f:
              b=json.load(f)
          with open("smoke_candidates.report.json",encoding="utf-8") as f:
              c=json.load(f)
          print(json.dumps({"biographies":b,"candidates":c},indent=2))
          if b.get("biographies_fetched",0) < 8:
              raise SystemExit("biography smoke failed: fewer than 8/12 pages fetched")
          if b.get("content_chars_total",0) < 50000:
              raise SystemExit("biography smoke failed: too little revision content")
          if c.get("candidate_rows",0) < 20:
              raise SystemExit("biography smoke failed: too few timeline candidates")
          PY
