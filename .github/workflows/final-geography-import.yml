name: Import final geography features

on:
  push:
    branches:
      - "data-run-final-geography-import*"
    paths:
      - "research/acquire/TRIGGER_FINAL_GEOGRAPHY_IMPORT.md"

permissions:
  contents: read
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen geography artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/wzj003243-dotcom/minggui-life-trajectory/actions/artifacts/11332916920/zip" \
            -o geography.zip
          echo "2f7e8aed9dcd79b59da8450db9dcb626599205719737eb807519280b67db7210  geography.zip" | sha256sum -c -
      - name: Archive and import geography features
        run: |
          curl -L --fail-with-body \
            --max-time 600 \
            -X POST \
            -H "Content-Type: application/zip" \
            --data-binary @geography.zip \
            "https://nyafyhtwwxezzvbvtykv.supabase.co/functions/v1/minggui-geography-artifact-import" \
            | tee import-result.json
          python - <<'PY'
          import json
          p=json.load(open("import-result.json"))
          if not p.get("ok"):
              raise SystemExit(p)
          print(json.dumps(p,indent=2))
          PY
