name: Timed core enrichment fast

on:
  push:
    branches:
      - "data-run-timed-core-fast*"
    paths:
      - "research/acquire/TRIGGER_TIMED_CORE_FAST.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: timed-core-fast
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download frozen verified timed-core artifact
        uses: actions/download-artifact@v4
        with:
          name: minggui-timed-linked-life-dataset
          path: prior
          repository: wzj003243-dotcom/minggui-life-trajectory
          run-id: 37118108407
          github-token: ${{ github.token }}

      - name: Restore core files from artifact
        run: |
          mkdir -p data/processed/timed
          echo "Downloaded artifact contents:"
          find prior -maxdepth 4 -type f | sort
          CORE=$(find prior -type f -name 'timed_linked_cohort.csv.gz' | head -1)
          BIRTHS=$(find prior -type f -name 'timed_canonical_births.csv.gz' | head -1)
          if [ -z "$CORE" ] || [ -z "$BIRTHS" ]; then
            echo "Required verified core files not found"
            exit 1
          fi
          cp "$CORE" data/processed/timed/timed_linked_cohort.csv.gz
          cp "$BIRTHS" data/processed/timed/timed_canonical_births.csv.gz
          OLD_EVENTS=$(find prior -type f -name 'timed_life_events_structured.csv.gz' | head -1 || true)
          if [ -n "$OLD_EVENTS" ]; then
            cp "$OLD_EVENTS" data/processed/timed/life_events_wikidata.csv.gz
          fi

      - name: Fetch fresh structured claims if needed
        run: |
          if [ ! -f data/processed/timed/life_events_wikidata.csv.gz ]; then
            python research/acquire/fetch_wikidata_claims_api.py               data/processed/timed/timed_linked_cohort.csv.gz               data/processed/timed/structured_claims.csv.gz               --id-column wikidata_id --rating-column rodden_rating --ratings AA,A,B               --batch-size 35 --sleep 0.20
            python research/pipeline/claims_to_life_events.py               data/processed/timed/structured_claims.csv.gz               data/processed/timed/timed_canonical_births.csv.gz               data/processed/timed/life_events_wikidata.csv.gz
          fi

      - name: Build ORCID bridge
        run: >
          python research/acquire/fetch_wikidata_external_ids.py
          data/processed/timed/timed_linked_cohort.csv.gz
          data/processed/timed/orcid_bridge.csv.gz
          --property P496
          --id-column wikidata_id

      - name: Build direct OpenAlex bridge
        run: >
          python research/acquire/fetch_wikidata_external_ids.py
          data/processed/timed/timed_linked_cohort.csv.gz
          data/processed/timed/openalex_bridge.csv.gz
          --property P10283
          --id-column wikidata_id

      - name: Build MusicBrainz bridge
        run: >
          python research/acquire/fetch_wikidata_external_ids.py
          data/processed/timed/timed_linked_cohort.csv.gz
          data/processed/timed/musicbrainz_bridge.csv.gz
          --property P434
          --id-column wikidata_id

      - name: Enrich OpenAlex through ORCID
        run: >
          python research/acquire/fetch_openalex_academic_events.py
          data/processed/timed/timed_linked_cohort.csv.gz
          data/processed/timed/openalex_orcid
          --id-column wikidata_id
          --limit 0
          --max-works-per-author 200
          --orcid-map data/processed/timed/orcid_bridge.csv.gz

      - name: Enrich OpenAlex through direct author IDs
        run: >
          python research/acquire/fetch_openalex_direct_events.py
          data/processed/timed/timed_linked_cohort.csv.gz
          data/processed/timed/openalex_bridge.csv.gz
          data/processed/timed/openalex_direct
          --id-column wikidata_id
          --limit 0
          --max-works-per-author 200

      - name: Enrich MusicBrainz timelines
        run: >
          python research/acquire/fetch_musicbrainz_events.py
          data/processed/timed/timed_linked_cohort.csv.gz
          data/processed/timed/musicbrainz
          --id-column wikidata_id
          --limit 0
          --mbid-map data/processed/timed/musicbrainz_bridge.csv.gz

      - name: Normalize scholarly events
        run: >
          python research/pipeline/external_events_to_lifegraph.py
          data/processed/timed/timed_canonical_births.csv.gz
          data/processed/timed/life_events_openalex.csv.gz
          data/processed/timed/openalex_orcid/academic_events.csv.gz
          data/processed/timed/openalex_direct/academic_events_p10283.csv.gz

      - name: Normalize music events
        run: >
          python research/pipeline/external_events_to_lifegraph.py
          data/processed/timed/timed_canonical_births.csv.gz
          data/processed/timed/life_events_musicbrainz.csv.gz
          data/processed/timed/musicbrainz/music_events.csv.gz

      - name: Canonicalize cross-source events
        run: >
          python research/pipeline/canonicalize_lifegraph_events.py
          data/processed/timed/life_events_canonical.csv.gz
          data/processed/timed/life_events_wikidata.csv.gz
          data/processed/timed/life_events_openalex.csv.gz
          data/processed/timed/life_events_musicbrainz.csv.gz

      - name: Measure core LifeGraph thickness
        run: >
          python research/quality/lifegraph_coverage_report.py
          data/processed/timed/core_lifegraph_coverage.json
          data/processed/timed/life_events_canonical.csv.gz
          --cohort data/processed/timed/timed_linked_cohort.csv.gz
          --cohort-id-column wikidata_id

      - name: Build cross-source yearly states
        run: >
          python research/pipeline/build_lifegraph_year_states.py
          data/processed/timed/life_events_wikidata.csv.gz
          data/processed/timed/core_year_states.csv.gz
          --additional-events
          data/processed/timed/life_events_openalex.csv.gz
          data/processed/timed/life_events_musicbrainz.csv.gz

      - name: Show reports
        if: always()
        run: |
          find data/processed/timed -name '*.report.json' -print -exec cat {} \; || true
          cat data/processed/timed/core_lifegraph_coverage.json || true

      - name: Upload fast enriched timed core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minggui-timed-core-enrichment-fast
          path: data/processed/timed/
          retention-days: 30
          if-no-files-found: warn
