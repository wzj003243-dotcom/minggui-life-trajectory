name: External adapter probe
on:
  push:
    branches: ["data-run-adapter-probe*"]
    paths: ["research/acquire/TRIGGER_ADAPTER_PROBE.md"]
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python research/tests/probe_wikidata_identifiers.py
