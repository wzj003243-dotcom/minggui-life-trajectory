name: Timed core biography enrichment

on:
  push:
    branches:
      - "data-run-timed-biography*"
    paths:
      - "research/acquire/TRIGGER_TIMED_BIOGRAPHY.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: timed-core-biography
  cancel-in-progress: true

jobs:
  biography:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download frozen timed-core artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/wzj003243-dotcom/minggui-life-trajectory/actions/artifacts/11330742270/zip" \
            -o artifact.zip
          mkdir artifact
          unzip -q artifact.zip -d artifact

      - name: Locate current timed-core inputs
        run: |
          python - <<'PY'
          import pathlib,shutil
          for name,dst in {
            "timed_linked_cohort.csv.gz":"data/processed/biography/timed_linked_cohort.csv.gz",
            "timed_canonical_births.csv.gz":"data/processed/biography/timed_canonical_births.csv.gz",
          }.items():
              hits=list(pathlib.Path("artifact").rglob(name))
              if not hits: raise SystemExit(f"missing {name}")
              pathlib.Path(dst).parent.mkdir(parents=True,exist_ok=True)
              shutil.copy2(hits[0],dst)
              print(name,"<-",hits[0])
          PY

      - name: Fetch revision-pinned biographies
        run: >
          python research/acquire/fetch_wikipedia_biographies.py
          data/processed/biography/timed_linked_cohort.csv.gz
          data/processed/biography/timed_biographies.jsonl.gz
          --id-column wikidata_id
          --limit 0

      - name: Install parser
        run: pip install mwparserfromhell==0.7.2

      - name: Extract timeline candidates
        run: >
          python research/extraction/extract_timeline_candidates.py
          data/processed/biography/timed_biographies.jsonl.gz
          data/processed/biography/timed_timeline_candidates.csv.gz

      - name: Convert precision-first rule events
        run: >
          python research/extraction/candidates_to_rule_events.py
          data/processed/biography/timed_timeline_candidates.csv.gz
          data/processed/biography/timed_canonical_births.csv.gz
          data/processed/biography/timed_biography_rule_events.csv.gz

      - name: Build Gold review queue
        run: >
          python research/extraction/build_gold_review_queue.py
          data/processed/biography/timed_timeline_candidates.csv.gz
          data/processed/biography/timed_gold_review_queue.csv.gz
          --people 300
          --max-per-person 8

      - name: Show reports
        if: always()
        run: |
          find data/processed/biography -name '*.report.json' -print -exec cat {} \; || true

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: minggui-timed-core-biography
          path: data/processed/biography/
          retention-days: 30
          if-no-files-found: warn
