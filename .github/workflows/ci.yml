name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  research-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check all research scripts
        run: find research -name '*.py' -print0 | xargs -0 python -m py_compile
      - name: Smoke test cutoff / target / leakage pipeline
        run: python research/tests/smoke_pipeline.py
      - name: Smoke test event normalization pipeline
        run: python research/tests/smoke_event_pipeline.py
      - name: Install biography parser dependency
        run: pip install mwparserfromhell==0.7.2
      - name: Smoke test biography parser
        run: python research/tests/smoke_biography_parser.py
