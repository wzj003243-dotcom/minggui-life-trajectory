name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm install
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build

  research-python:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Syntax check all research scripts
        run: find research -name '*.py' -print0 | xargs -0 python -m py_compile
      - name: Smoke test cutoff / target / leakage pipeline
        run: python research/tests/smoke_pipeline.py

  acquire-public-data:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Acquire verified public datasets
        run: python research/acquire/fetch_public_datasets.py
      - name: Normalize public cohorts
        run: python research/normalize/public_cohorts.py data/raw/acquired data/processed/public
      - name: Fetch precision-aware Wikidata births for first 25k cohort
        run: python research/acquire/fetch_wikidata_birth_assertions.py data/processed/public/bhht_core.csv.gz data/processed/public/wikidata_birth_assertions_25k.csv.gz --limit 25000 --batch-size 150
      - name: Show acquisition and cohort reports
        if: always()
        run: |
          cat data/raw/acquired/acquisition_report.json || true
          cat data/processed/public/public_cohort_profile.json || true
          cat data/processed/public/wikidata_birth_assertions_25k.csv.report.json || true
      - name: Upload processed research data
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minggui-processed-public-data
          path: |
            data/processed/public/
            data/raw/acquired/acquisition_report.json
          retention-days: 14
          if-no-files-found: warn
