name: Import final v1 round3 results

on:
  push:
    branches:
      - "data-run-import-final-v1-round3*"
    paths:
      - "research/training/TRIGGER_IMPORT_FINAL_V1_ROUND3.md"

permissions:
  contents: read
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - name: Download exact round3 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/wzj003243-dotcom/minggui-life-trajectory/actions/artifacts/11392340286/zip" \
            -o round3.zip
          echo "5344a9c993602c29ced4c6453ccee4bd78f782046b2f08b1374619c2a451c293  round3.zip" | sha256sum -c -
      - name: Import frozen round3 bundle
        run: |
          curl -L --fail-with-body --max-time 1200 \
            -X POST \
            -H "Content-Type: application/zip" \
            --data-binary @round3.zip \
            "https://nyafyhtwwxezzvbvtykv.supabase.co/functions/v1/minggui-round3-result-import" \
            | tee import-result.json
          python - <<'PY'
          import json
          p=json.load(open("import-result.json"))
          if not p.get("ok"):
              raise SystemExit(p)
          print(json.dumps(p,indent=2))
          PY
