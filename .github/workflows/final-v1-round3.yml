name: Final v1 benchmark round 3

on:
  push:
    branches:
      - "data-run-final-v1-round3*"
    paths:
      - "research/training/TRIGGER_FINAL_V1_ROUND3.md"

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Download frozen holdout rows
        run: |
          mkdir -p data/round3-export
          for offset in 0 1000 2000 3000 4000 5000 6000 7000; do
            curl -L --fail-with-body --max-time 120 \
              "https://nyafyhtwwxezzvbvtykv.supabase.co/functions/v1/minggui-training-export-r3?offset=${offset}&limit=1000" \
              -o "data/round3-export/chunk-${offset}.json"
          done
          python - <<'PY'
          import json, pathlib
          total=0
          for p in sorted(pathlib.Path("data/round3-export").glob("chunk-*.json")):
              rows=json.load(open(p))
              assert isinstance(rows,list), p
              total += len(rows)
          print("rows",total)
          assert total == 7465,total
          PY
      - name: Install benchmark dependencies
        run: pip install "pandas>=2.2,<3" "numpy>=2.0,<3" "scikit-learn>=1.6,<2" "joblib>=1.4,<2"
      - name: Run frozen Round 3 robustness benchmark
        run: |
          python research/models/benchmark_final_v1_round3.py \
            data/round3-export \
            data/round3-results \
            | tee data/round3-results.log
      - name: Show summary
        if: always()
        run: |
          cat data/round3-results/round3_summary.json || true
          cat data/round3-results/SHA256SUMS.json || true
      - name: Upload benchmark artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minggui-final-v1-round3
          path: |
            data/round3-results/
            data/round3-results.log
          retention-days: 14
          if-no-files-found: error
