name: Audit v1.1 biography shards

on:
  workflow_run:
    workflows: ["v1.1 biography enrichment sharded", "v1.1 biography enrichment resume", "v1.1 biography enrichment corrected"]
    types: [completed]

permissions:
  contents: read
  actions: read

jobs:
  audit:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Download all four shard artifacts
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          mkdir -p data/v11-biography-shards
          for shard in 0 1 2 3; do
            gh run download "$RUN_ID" \
              --repo "${{ github.repository }}" \
              --name "minggui-v11-biography-shard-$shard" \
              --dir "data/v11-biography-shards/shard-$shard"
            (
              cd "data/v11-biography-shards/shard-$shard"
              zip -qr "../shard-$shard.zip" .
            )
          done

      - name: Audit shard union
        run: |
          python research/audits/audit_v11_biography_shards.py \
            data/v11-biography-shards/shard-0.zip \
            data/v11-biography-shards/shard-1.zip \
            data/v11-biography-shards/shard-2.zip \
            data/v11-biography-shards/shard-3.zip \
            --out data/v11-biography-audit

      - name: Record exact artifact metadata
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          gh api "repos/${{ github.repository }}/actions/runs/$RUN_ID/artifacts" \
            > data/v11-biography-audit/github-artifacts.json
          sha256sum data/v11-biography-shards/shard-*.zip \
            > data/v11-biography-audit/local-repacked-sha256.txt

      - name: Prepare hash-addressed import chunks
        env:
          RUN_ID: ${{ github.event.workflow_run.id }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          python research/import/prepare_v11_biography_import.py \
            --artifact-metadata data/v11-biography-audit/github-artifacts.json \
            --source-run-id "$RUN_ID" \
            --source-git-sha "$HEAD_SHA" \
            --out data/v11-biography-audit/import-chunks \
            data/v11-biography-shards/shard-0.zip \
            data/v11-biography-shards/shard-1.zip \
            data/v11-biography-shards/shard-2.zip \
            data/v11-biography-shards/shard-3.zip

      - name: Build generated import control
        env:
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
          AUDIT_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json,os,pathlib
          root=pathlib.Path("data/v11-biography-audit")
          manifest=json.load(open(root/"import-chunks/import-manifest.json"))
          sha=(root/"import-chunks/import-manifest.sha256").read_text().split()[0]
          ctl={
            "target_snapshot_id":"7fce3b79-ebfc-40b2-a5f0-e91b28db6a02",
            "source_workflow_run_id":str(os.environ["SOURCE_RUN_ID"]),
            "audit_workflow_run_id":str(os.environ["AUDIT_RUN_ID"]),
            "audit_manifest_sha256":sha,
            "shards":[
              {
                "shard":int(s),
                "artifact_id":str(info["provider_artifact_id"]),
                "sha256":info["source_artifact_sha256"]
              }
              for s,info in sorted(manifest["shards"].items(),key=lambda kv:int(kv[0]))
            ]
          }
          (root/"import-control.generated.json").write_text(
            json.dumps(ctl,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps(ctl,indent=2))
          PY

      - name: Upload union audit
        uses: actions/upload-artifact@v4
        with:
          name: minggui-v11-biography-union-audit
          path: data/v11-biography-audit/
          retention-days: 30
          if-no-files-found: error
