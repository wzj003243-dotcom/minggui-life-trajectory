name: Music creator enrichment

on:
  push:
    branches:
      - "data-run-music*"
    paths:
      - "research/acquire/TRIGGER_MUSIC.md"

concurrency:
  group: musicbrainz-enrichment
  cancel-in-progress: false

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Restore pinned public source cache
        id: sources
        uses: actions/cache@v4
        with:
          path: data/raw/acquired/
          key: minggui-public-sources-v1-fe44aa6f
      - name: Acquire verified public datasets
        if: steps.sources.outputs.cache-hit != 'true'
        run: python research/acquire/fetch_public_datasets.py
      - name: Verify pinned source checksums
        run: python research/quality/verify_public_sources.py data/raw/acquired
      - name: Normalize BHHT backbone
        run: python research/normalize/public_cohorts.py data/raw/acquired data/processed/music
      - name: Select music-targeted 300 cohort
        run: >
          python research/cohorts/select_occupation_targeted.py
          data/processed/music/bhht_core.csv.gz
          data/processed/music/music_targeted_300.csv.gz
          --keywords "music,singer,musician,composer,songwriter,rapper,dj,vocalist,conductor,instrument"
          --target 300
      - name: Build Wikidata MusicBrainz bridge
        run: >
          python research/acquire/fetch_wikidata_external_ids.py
          data/processed/music/music_targeted_300.csv.gz
          data/processed/music/musicbrainz_bridge.csv.gz
          --property P434
          --id-column wikidata_code

      - name: Enrich MusicBrainz release and event timelines
        run: >
          python research/acquire/fetch_musicbrainz_events.py
          data/processed/music/music_targeted_300.csv.gz
          data/processed/music/musicbrainz
          --id-column wikidata_code
          --limit 300
          --mbid-map data/processed/music/musicbrainz_bridge.csv.gz
      - name: Build yearly music state vectors
        run: >
          python research/pipeline/build_music_year_states.py
          data/processed/music/musicbrainz/music_events.csv.gz
          data/processed/music/musicbrainz/music_year_states.csv.gz
      - name: Show reports
        if: always()
        run: |
          find data/processed/music -name '*.report.json' -print -exec cat {} \; || true
      - name: Upload music enrichment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minggui-music-life-enrichment
          path: data/processed/music/
          retention-days: 30
          if-no-files-found: warn
