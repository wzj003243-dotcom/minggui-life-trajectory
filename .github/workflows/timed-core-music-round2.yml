name: Timed core MusicBrainz addon round 2

on:
  push:
    branches:
      - "data-run-timed-core-music-r2*"
    paths:
      - "research/acquire/TRIGGER_TIMED_CORE_MUSIC_R2.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: timed-core-music-r2
  cancel-in-progress: true

jobs:
  music:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download Music round-1 artifact
        uses: actions/download-artifact@v4
        with:
          name: minggui-timed-core-music-enrichment
          path: prior
          repository: wzj003243-dotcom/minggui-life-trajectory
          run-id: 37278833653
          github-token: ${{ github.token }}

      - name: Restore prior files
        run: |
          mkdir -p data/processed/timed
          for name in timed_linked_cohort.csv.gz timed_canonical_births.csv.gz core_lifegraph_coverage_music.json life_events_wikidata.csv.gz life_events_openalex.csv.gz life_events_musicbrainz.csv.gz musicbrainz_bridge.csv.gz music_leverage_250.csv.gz; do
            SRC=$(find prior -type f -name "$name" | head -1)
            if [ -z "$SRC" ]; then
              echo "Missing $name"
              exit 1
            fi
            cp "$SRC" "data/processed/timed/$name"
          done

      - name: Select non-overlapping high-leverage round-2 cohort
        run: >
          python research/cohorts/select_external_id_leverage.py
          data/processed/timed/core_lifegraph_coverage_music.json
          data/processed/timed/timed_linked_cohort.csv.gz
          data/processed/timed/musicbrainz_bridge.csv.gz
          data/processed/timed/music_leverage_round2_250.csv.gz
          --target 250
          --max-per-country 30
          --exclude-cohort data/processed/timed/music_leverage_250.csv.gz

      - name: Enrich MusicBrainz round 2
        run: >
          python research/acquire/fetch_musicbrainz_events.py
          data/processed/timed/music_leverage_round2_250.csv.gz
          data/processed/timed/musicbrainz_round2
          --id-column wikidata_id
          --limit 250
          --mbid-map data/processed/timed/musicbrainz_bridge.csv.gz

      - name: Normalize round-2 music events
        run: >
          python research/pipeline/external_events_to_lifegraph.py
          data/processed/timed/timed_canonical_births.csv.gz
          data/processed/timed/life_events_musicbrainz_round2.csv.gz
          data/processed/timed/musicbrainz_round2/music_events.csv.gz

      - name: Canonicalize baseline plus both Music rounds
        run: >
          python research/pipeline/canonicalize_lifegraph_events.py
          data/processed/timed/life_events_canonical_music_round2.csv.gz
          data/processed/timed/life_events_wikidata.csv.gz
          data/processed/timed/life_events_openalex.csv.gz
          data/processed/timed/life_events_musicbrainz.csv.gz
          data/processed/timed/life_events_musicbrainz_round2.csv.gz

      - name: Measure round-2 thickness
        run: >
          python research/quality/lifegraph_coverage_report.py
          data/processed/timed/core_lifegraph_coverage_music_round2.json
          data/processed/timed/life_events_canonical_music_round2.csv.gz
          --cohort data/processed/timed/timed_linked_cohort.csv.gz
          --cohort-id-column wikidata_id

      - name: Build cross-source yearly states
        run: >
          python research/pipeline/build_lifegraph_year_states.py
          data/processed/timed/life_events_wikidata.csv.gz
          data/processed/timed/core_year_states_music_round2.csv.gz
          --additional-events
          data/processed/timed/life_events_openalex.csv.gz
          data/processed/timed/life_events_musicbrainz.csv.gz
          data/processed/timed/life_events_musicbrainz_round2.csv.gz

      - name: Show reports
        if: always()
        run: |
          find data/processed/timed -name '*.report.json' -print -exec cat {} \; || true
          cat data/processed/timed/core_lifegraph_coverage_music_round2.json || true

      - name: Upload Music round-2 enriched core
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minggui-timed-core-music-enrichment-round2
          path: data/processed/timed/
          retention-days: 30
          if-no-files-found: warn
