name: Import final event enrichment

on:
  push:
    branches:
      - "data-run-final-event-import*"
    paths:
      - "research/acquire/TRIGGER_FINAL_EVENT_IMPORT.md"

permissions:
  contents: read
  actions: read

jobs:
  musicbrainz:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download complete MusicBrainz enrichment
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/wzj003243-dotcom/minggui-life-trajectory/actions/artifacts/11342247791/zip" \
            -o musicbrainz.zip
          echo "0b2718c8feff8303eb74a289c25c93548ea7efd6db8e7aaad102682f01697e47  musicbrainz.zip" | sha256sum -c -
      - name: Import MusicBrainz events into final snapshot
        run: |
          curl -L --fail-with-body \
            --max-time 600 \
            -X POST \
            -H "Content-Type: application/zip" \
            --data-binary @musicbrainz.zip \
            "https://nyafyhtwwxezzvbvtykv.supabase.co/functions/v1/minggui-event-artifact-import" \
            | tee import-result.json
          python - <<'PY'
          import json
          p=json.load(open("import-result.json"))
          if not p.get("ok"):
              raise SystemExit(p)
          print(json.dumps(p,indent=2))
          PY
