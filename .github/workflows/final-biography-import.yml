name: Import final biography enrichment

on:
  push:
    branches:
      - "data-run-final-biography-import*"
    paths:
      - "research/acquire/TRIGGER_FINAL_BIOGRAPHY_IMPORT.md"

permissions:
  contents: read
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download frozen biography enrichment artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/wzj003243-dotcom/minggui-life-trajectory/actions/artifacts/11332298618/zip" \
            -o biography.zip
          echo "a27cc246669b08dca85d61ff40f73551d24ab1424275537b69214c52c7c49c33  biography.zip" | sha256sum -c -
      - name: Archive and import biography candidates and rule events
        run: |
          curl -L --fail-with-body \
            --max-time 900 \
            -X POST \
            -H "Content-Type: application/zip" \
            --data-binary @biography.zip \
            "https://nyafyhtwwxezzvbvtykv.supabase.co/functions/v1/minggui-biography-artifact-import" \
            | tee import-result.json
          python - <<'PY'
          import json
          p=json.load(open("import-result.json"))
          if not p.get("ok"):
              raise SystemExit(p)
          print(json.dumps(p,indent=2))
          PY
