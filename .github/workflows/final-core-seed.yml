name: Seed final lossless core

on:
  push:
    branches:
      - "data-run-final-core-seed-v1"
    paths:
      - "research/acquire/TRIGGER_FINAL_CORE_SEED.md"

permissions:
  contents: read
  actions: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Download final lossless identity artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body             -H "Accept: application/vnd.github+json"             -H "Authorization: Bearer $GH_TOKEN"             -H "X-GitHub-Api-Version: 2022-11-28"             "https://api.github.com/repos/wzj003243-dotcom/minggui-life-trajectory/actions/artifacts/11341368186/zip"             -o artifact.zip
          sha256sum artifact.zip
      - name: Import final core into Supabase
        run: |
          curl -L --fail-with-body             --max-time 600             -X POST             -H "Content-Type: application/zip"             --data-binary @artifact.zip             "https://nyafyhtwwxezzvbvtykv.supabase.co/functions/v1/minggui-final-core-import"             | tee import-result.json
          python - <<'PY'
          import json
          p=json.load(open("import-result.json"))
          if not p.get("ok"): raise SystemExit(p)
          print(json.dumps(p,indent=2))
          PY
