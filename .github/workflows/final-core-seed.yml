name: Seed final timed core to Supabase

on:
  push:
    branches:
      - "data-run-final-core-seed*"
    paths:
      - "research/acquire/TRIGGER_FINAL_CORE_SEED.md"

permissions:
  contents: read
  actions: read

jobs:
  seed:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download final identity artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/wzj003243-dotcom/minggui-life-trajectory/actions/artifacts/11341368186/zip" \
            -o final-core.zip
          echo "c39faf8249a723e0528cb91acbfc812fcc00373df63a8c7be6e90df4363153ef  final-core.zip" | sha256sum -c -
      - name: Import final core
        run: |
          curl -L --fail-with-body \
            --max-time 600 \
            -X POST \
            -H "Content-Type: application/zip" \
            --data-binary @final-core.zip \
            "https://nyafyhtwwxezzvbvtykv.supabase.co/functions/v1/minggui-final-core-import" \
            | tee import-result.json
          python - <<'PY'
          import json
          p=json.load(open("import-result.json"))
          if not p.get("ok"):
              raise SystemExit(p)
          print(json.dumps(p,indent=2))
          PY
