name: Timed core family and degree enrichment

on:
  push:
    branches:
      - "data-run-timed-core-family*"
    paths:
      - "research/acquire/TRIGGER_TIMED_CORE_FAMILY.md"

permissions:
  contents: read
  actions: read

concurrency:
  group: timed-core-family
  cancel-in-progress: true

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download frozen verified timed-core artifact
        uses: actions/download-artifact@v4
        with:
          name: minggui-timed-linked-life-dataset
          path: prior
          repository: wzj003243-dotcom/minggui-life-trajectory
          run-id: 37118108407
          github-token: ${{ github.token }}

      - name: Restore core and canonical births
        run: |
          mkdir -p data/processed/timed
          CORE=$(find prior -type f -name 'timed_linked_cohort.csv.gz' | head -1)
          BIRTHS=$(find prior -type f -name 'timed_canonical_births.csv.gz' | head -1)
          test -n "$CORE" && test -n "$BIRTHS"
          cp "$CORE" data/processed/timed/timed_linked_cohort.csv.gz
          cp "$BIRTHS" data/processed/timed/timed_canonical_births.csv.gz

      - name: Fetch latest dated structured claims
        run: >
          python research/acquire/fetch_wikidata_claims_api.py
          data/processed/timed/timed_linked_cohort.csv.gz
          data/processed/timed/structured_claims_degree_v2.csv.gz
          --id-column wikidata_id
          --rating-column rodden_rating
          --ratings AA,A,B
          --batch-size 35
          --sleep 0.20

      - name: Normalize structured events
        run: >
          python research/pipeline/claims_to_life_events.py
          data/processed/timed/structured_claims_degree_v2.csv.gz
          data/processed/timed/timed_canonical_births.csv.gz
          data/processed/timed/life_events_structured_degree_v2.csv.gz

      - name: Fetch child-birth family events
        run: >
          python research/acquire/fetch_wikidata_family_events.py
          data/processed/timed/timed_linked_cohort.csv.gz
          data/processed/timed/timed_canonical_births.csv.gz
          data/processed/timed/life_events_family_child_birth.csv.gz
          --id-column wikidata_id
          --batch-size 40
          --sleep 0.20

      - name: Canonicalize structured and family events
        run: >
          python research/pipeline/canonicalize_lifegraph_events.py
          data/processed/timed/life_events_structured_family_canonical.csv.gz
          data/processed/timed/life_events_structured_degree_v2.csv.gz
          data/processed/timed/life_events_family_child_birth.csv.gz

      - name: Measure structured-plus-family thickness
        run: >
          python research/quality/lifegraph_coverage_report.py
          data/processed/timed/core_structured_family_coverage.json
          data/processed/timed/life_events_structured_family_canonical.csv.gz
          --cohort data/processed/timed/timed_linked_cohort.csv.gz
          --cohort-id-column wikidata_id
          --min-sources 1

      - name: Show reports
        if: always()
        run: |
          find data/processed/timed -name '*.report.json' -print -exec cat {} \; || true
          cat data/processed/timed/core_structured_family_coverage.json || true

      - name: Upload family-degree enrichment
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minggui-timed-core-family-degree
          path: data/processed/timed/
          retention-days: 30
          if-no-files-found: warn
