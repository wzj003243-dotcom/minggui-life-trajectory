name: Academic life enrichment

on:
  push:
    branches:
      - "data-run-academic*"
    paths:
      - "research/acquire/TRIGGER_ACADEMIC.md"

concurrency:
  group: academic-openalex
  cancel-in-progress: false

jobs:
  academic:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore pinned public source cache
        id: sources
        uses: actions/cache@v4
        with:
          path: data/raw/acquired/
          key: minggui-public-sources-v1-fe44aa6f

      - name: Acquire verified public datasets
        if: steps.sources.outputs.cache-hit != 'true'
        run: python research/acquire/fetch_public_datasets.py

      - name: Verify pinned source checksums
        run: python research/quality/verify_public_sources.py data/raw/acquired

      - name: Normalize BHHT backbone
        run: python research/normalize/public_cohorts.py data/raw/acquired data/processed/academic

      - name: Select balanced 3k cohort
        run: >
          python research/cohorts/select_stratified_bhht.py
          data/processed/academic/bhht_core.csv.gz
          data/processed/academic/bhht_stratified_3k.csv.gz
          --target 3000
          --min-per-stratum 2

      - name: Build Wikidata ORCID bridge
        run: >
          python research/acquire/fetch_wikidata_external_ids.py
          data/processed/academic/bhht_stratified_3k.csv.gz
          data/processed/academic/orcid_bridge.csv.gz
          --property P496
          --id-column wikidata_code

      - name: Enrich ORCID-verified academic timelines
        run: >
          python research/acquire/fetch_openalex_academic_events.py
          data/processed/academic/bhht_stratified_3k.csv.gz
          data/processed/academic/openalex
          --id-column wikidata_id
          --limit 3000
          --max-works-per-author 500
          --orcid-map data/processed/academic/orcid_bridge.csv.gz

      - name: Build yearly academic state vectors
        run: >
          python research/pipeline/build_academic_year_states.py
          data/processed/academic/openalex/academic_events.csv.gz
          data/processed/academic/openalex/academic_year_states.csv.gz

      - name: Show reports
        if: always()
        run: |
          find data/processed/academic -name '*.report.json' -print -exec cat {} \; || true

      - name: Upload academic enrichment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minggui-academic-life-enrichment
          path: data/processed/academic/
          retention-days: 30
          if-no-files-found: warn
