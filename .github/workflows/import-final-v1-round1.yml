name: Import final v1 round1 results

on:
  push:
    branches:
      - "data-run-import-final-v1-round1*"
    paths:
      - "research/training/TRIGGER_IMPORT_FINAL_V1_ROUND1.md"

permissions:
  contents: read
  actions: read

jobs:
  import:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Download exact round1 artifact
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl -L --fail-with-body \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/wzj003243-dotcom/minggui-life-trajectory/actions/artifacts/11389687413/zip" \
            -o round1.zip
          echo "e39ef02bd94cbab2d767d9c786679d48528b4317e85fbdccf12d3b9d822ba387  round1.zip" | sha256sum -c -
      - name: Import frozen round1 bundle
        run: |
          curl -L --fail-with-body --max-time 600 \
            -X POST \
            -H "Content-Type: application/zip" \
            --data-binary @round1.zip \
            "https://nyafyhtwwxezzvbvtykv.supabase.co/functions/v1/minggui-round1-result-import" \
            | tee import-result.json
          python - <<'PY'
          import json
          p=json.load(open("import-result.json"))
          if not p.get("ok"):
              raise SystemExit(p)
          print(json.dumps(p,indent=2))
          PY
