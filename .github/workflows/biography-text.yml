name: Biography text enrichment

on:
  push:
    branches:
      - "data-run-biography*"
    paths:
      - "research/acquire/TRIGGER_BIOGRAPHY.md"

concurrency:
  group: wikidata-heavy
  cancel-in-progress: false

jobs:
  biography-text:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Restore pinned public source cache
        id: sources
        uses: actions/cache@v4
        with:
          path: data/raw/acquired/
          key: minggui-public-sources-v1-fe44aa6f

      - name: Acquire verified public datasets
        if: steps.sources.outputs.cache-hit != 'true'
        run: python research/acquire/fetch_public_datasets.py

      - name: Verify pinned source checksums
        run: python research/quality/verify_public_sources.py data/raw/acquired

      - name: Normalize BHHT backbone
        run: python research/normalize/public_cohorts.py data/raw/acquired data/processed/biography

      - name: Select balanced 750 cohort
        run: >
          python research/cohorts/select_stratified_bhht.py
          data/processed/biography/bhht_core.csv.gz
          data/processed/biography/bhht_stratified_750.csv.gz
          --target 750
          --min-per-stratum 2

      - name: Fetch precise Wikidata births
        run: >
          python research/acquire/fetch_wikidata_birth_assertions.py
          data/processed/biography/bhht_stratified_750.csv.gz
          data/processed/biography/wikidata_birth_assertions_750.csv.gz
          --limit 0
          --batch-size 120

      - name: Canonicalize births
        run: >
          python research/pipeline/canonicalize_births.py
          data/processed/biography/wikidata_birth_assertions_750.csv.gz
          data/processed/biography/canonical_births_750.csv.gz

      - name: Select clean 500 text cohort
        run: >
          python research/cohorts/select_event_enrichment_cohort.py
          data/processed/biography/bhht_stratified_750.csv.gz
          data/processed/biography/canonical_births_750.csv.gz
          data/processed/biography/text_cohort_500.csv.gz
          --target 500

      - name: Build Wikipedia sitelink bridge
        run: >
          python research/acquire/fetch_wikipedia_sitelinks.py
          data/processed/biography/text_cohort_500.csv.gz
          data/processed/biography/wikipedia_sitelinks_500.csv.gz
          --id-column wikidata_code
          --limit 500

      - name: Fetch revision-pinned biographies
        run: >
          python research/acquire/fetch_wikipedia_biographies.py
          data/processed/biography/text_cohort_500.csv.gz
          data/processed/biography/wikipedia_biographies_500.jsonl.gz
          --id-column wikidata_code
          --limit 2000
          --sitelink-map data/processed/biography/wikipedia_sitelinks_500.csv.gz

      - name: Install biography parser
        run: pip install mwparserfromhell==0.7.2

      - name: Extract date-bearing timeline candidates
        run: >
          python research/extraction/extract_timeline_candidates.py
          data/processed/biography/wikipedia_biographies_500.jsonl.gz
          data/processed/biography/timeline_candidates_500.csv.gz

      - name: Convert high-precision candidates to rule events
        run: >
          python research/extraction/candidates_to_rule_events.py
          data/processed/biography/timeline_candidates_500.csv.gz
          data/processed/biography/canonical_births_750.csv.gz
          data/processed/biography/biography_rule_events_500.csv.gz

      - name: Select Gold 300 review cohort
        run: >
          python research/cohorts/select_gold300.py
          data/processed/biography/text_cohort_500.csv.gz
          data/processed/biography/gold300_people.csv.gz
          --target 300
          --id-column wikidata_code

      - name: Build Gold review queue
        run: >
          python research/extraction/build_gold_review_queue.py
          data/processed/biography/timeline_candidates_500.csv.gz
          data/processed/biography/gold300_review_queue.csv.gz
          --people 300
          --max-per-person 8

      - name: Show reports
        if: always()
        run: |
          find data/processed/biography -maxdepth 1 -name '*.report.json' -print -exec cat {} \; || true

      - name: Upload biography enrichment artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: minggui-biography-text-cohort
          path: data/processed/biography/
          retention-days: 30
          if-no-files-found: warn
