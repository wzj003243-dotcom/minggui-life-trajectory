name: Wikidata identifier probe
on:
  push:
    branches: ["data-run-id-probe"]
    paths: ["research/acquire/TRIGGER_ID_PROBE.md"]
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: python research/tests/probe_wikidata_identifiers.py
